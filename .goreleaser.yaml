# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: ash

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

before:
  hooks:
    - go mod tidy

gomod:
  proxy: true

builds:
  - binary: ash
    main: .
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/andrinoff/ash/internal/shell.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    wrap_in_directory: true
    files:
      - README*
      - LICENSE*
      - docs/*.md

nfpms:
  - vendor: andrinoff
    homepage: https://github.com/andrinoff/ash
    maintainer: drew <me@andrinoff.com>
    description: A shell for people who like fish but keep pasting bash.
    license: MIT
    file_name_template: "{{ .ConventionalFileName }}"
    formats:
      - apk
      - deb
      - rpm
      - archlinux
    section: shells
    contents:
      - src: README.md
        dst: /usr/share/doc/ash/README.md
      - src: docs/*.md
        dst: /usr/share/doc/ash/
      - src: LICENSE
        dst: /usr/share/licenses/ash/LICENSE

homebrew_casks:
  - name: ash
    repository:
      owner: andrinoff
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/andrinoff/ash
    description: A shell for people who like fish but keep pasting bash.
    license: MIT
    commit_author:
      name: drew
      email: me@andrinoff.com
    commit_msg_template: "ash {{ .Tag }}"
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/ash"]
          end

checksum:
  name_template: checksums.txt

source:
  enabled: true

sboms:
  - artifacts: archive
  - id: source
    artifacts: source

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  use: github
  format: "{{ .SHA }}: {{ .Message }} ({{ with .AuthorUsername }}@{{ . }}{{ else }}{{ .AuthorName }}{{ end }})"
  filters:
    exclude:
      - "^test:"
      - "^chore"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
  groups:
    - title: "New!"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 100
    - title: "Faster"
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 150
    - title: "Fixed"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 200
    - title: "Deps"
      regexp: '^.*?\(deps\)!?:.+$'
      order: 300
    - title: "Docs"
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 400
    - title: "Other stuff"
      order: 9999

git:
  tag_sort: semver

release:
  prerelease: auto
